[package]
name = "codelibre_text"
description = "Clean Architecture: Frameworks & Drivers. egui/eframe UI, syntect, native dialogs, clipboard, file system and main()."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codelibre_text"
path = "src/main.rs"

[dependencies]
entities.workspace = true
use_cases.workspace = true
interface_adapters.workspace = true
serde_json.workspace = true

# UI framework - fast, native, no browser
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu"] }
# Syntax highlighting: Sublime Text's own formats (.sublime-syntax, .tmTheme)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# The YAML reader syntect uses: version 2 syntaxes (`extends`, `branch`) are rewritten before it reads them
yaml-rust = "0.4"
# The images of plugins' minihtml (`<img>`: PNG, JPEG and GIF, as Sublime's)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Native file dialogs and clipboard
rfd = "0.15"
arboard = "3"
# Platform directories and .gitignore-aware folder walking
directories = "5.0"
# The operating system language, for `"language": "auto"`
sys-locale = "0.3"
ignore = "0.4"
# Command line and logging
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Attaches to the terminal that started the GUI program (main.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

# The menu in the macOS menu bar (views/native_menu.rs); `objc2` tells a click from a key equivalent
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }

# Embeds assets/icons/codelibre_text.ico into the .exe (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
# Rewriting an installed package's metadata (tests/sublime_packages.rs, the upgrade)
zip.workspace = true
