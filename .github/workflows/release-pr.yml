# Writes the description of the pull request into release/<version> from its commits: the version,
# whether it goes to main, the pull requests it brings and every commit grouped by type, with its
# details (.github/scripts/release-pr-body.sh). What is written by hand outside the markers
# <!-- auto:start --> / <!-- auto:end --> is kept, so the description can be edited freely.
# - Runs when such a pull request is opened (by open-release.yml or by hand on the web) and on every
#   push to its branch (develop), so the description follows the commits.
# - open-release.yml and to-main.yml (when a tag to-main/<version> is pushed) call it with the
#   version, to describe the open pull request into release/<version>.
name: Release pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "release/**"
  workflow_call:
    inputs:
      version:
        description: The version of the release/<version> branch (or a tag to-main/<version>)
        type: string
        required: true

permissions:
  contents: read

jobs:
  describe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: pr
        name: Find the pull request
        env:
          INPUT: ${{ inputs.version }}
          BASE_REF: ${{ github.base_ref }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$NUMBER" ] && [ -z "$INPUT" ]; then
            version="${BASE_REF#release/}"
          else
            # A version has no /: this also takes a tag name (to-main/<version>).
            version="${INPUT##*/}"
            NUMBER=$(gh pr list --base "release/$version" --state open --json number --jq '.[0].number')
          fi
          if [ -z "$NUMBER" ]; then
            echo "::notice::no open pull request into release/$version"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr.outputs.number != ''
        with:
          fetch-depth: 0
      - name: Write the description
        if: steps.pr.outputs.number != ''
        env:
          VERSION: ${{ steps.pr.outputs.version }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # The pull request's own head, also when it comes from a fork.
          git fetch --quiet origin "+refs/pull/$NUMBER/head:refs/remotes/pull/head"
          gh pr view "$NUMBER" --json body --jq '.body' > "$RUNNER_TEMP/current.md"
          bash .github/scripts/release-pr-body.sh "$VERSION" "origin/release/$VERSION" pull/head \
            "$RUNNER_TEMP/current.md" > "$RUNNER_TEMP/body.md"
          gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md"
