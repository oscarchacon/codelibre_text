# Opens a release: creates the branch release/<version> from main and a pull request from develop
# into it, described from its commits (release-pr.yml). Merging that pull request builds the
# release (release.yml); creating the branch builds nothing.
# - Push a tag open-release/<version>:
#   git tag open-release/0.1.1-alpha develop && git push origin open-release/0.1.1-alpha
# - Or Actions > Open release > Run workflow (once this file is in main).
# - Or create release/<version> from main by hand on the web and open the pull request from develop:
#   release-pr.yml describes it all the same.
name: Open release

on:
  push:
    tags:
      - "open-release/*"
  workflow_dispatch:
    inputs:
      version:
        description: The new version (0.1.1-alpha)
        type: string
        required: true

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # This secret holds a token that can write contents, pull requests and workflows: by default
      # github.token cannot create pull requests.
      GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # X.Y.Z, X.Y.Z-alpha.1, X.Y.Z.W-alpha...: the rules are in .github/scripts/version.sh.
      - id: version
        name: Read the version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${INPUT:-${TAG#open-release/}}"
          bash .github/scripts/version.sh check "$version"
          if gh api "repos/$GH_REPO/branches/release/$version" --silent 2> /dev/null; then
            echo "::error::release/$version exists already"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The branch is main as it is: its push creates the branch, which release.yml skips.
      - name: Create the branch from main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/heads/release/$VERSION" -f "sha=$sha" --silent
          echo "release/$VERSION created from main ($sha)"
      - name: Open the pull request from develop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh pr create --head develop --base "release/$VERSION" --title "Release $VERSION" \
            --body "develop into release/$VERSION (created from main). The description is being written from the commits."

  # The description from the commits (also run by the pull request's own opened event when the
  # token above is RELEASE_PUSH_TOKEN: writing it twice is harmless).
  describe:
    needs: open
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/release-pr.yml
    with:
      version: ${{ needs.open.outputs.version }}
    secrets: inherit
