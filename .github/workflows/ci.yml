# Tests and clippy on Linux and Windows: for every push to main or develop and every pull request
# into main, develop or a release/<version> branch. macOS runs only when asked, since its runners
# are slow and scarce:
# - pushing a tag macos-test (or macos-test-<anything>) runs them on macOS alone, on the tagged commit
#   (git tag -f macos-test && git push -f origin macos-test);
# - running the workflow by hand (Actions > CI > Run workflow) with "macos" checked adds macOS;
# - the release workflow calls it with macos: true, so no installer is built from code whose tests
#   fail on any platform.
name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "macos-test*"
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  workflow_dispatch:
    inputs:
      macos:
        description: Also on macOS
        type: boolean
        default: false
  workflow_call:
    inputs:
      macos:
        description: Also on macOS
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(startsWith(github.ref, 'refs/tags/macos-test') && '["macos-latest"]'
          || inputs.macos && '["ubuntu-22.04", "windows-latest", "macos-latest"]'
          || '["ubuntu-22.04", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libwayland-dev libxkbcommon-dev
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      # Python runs the plugin host tests (crates/frameworks/tests/python_plugin_host.rs).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
