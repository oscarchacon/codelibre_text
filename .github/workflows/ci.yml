# Tests and clippy on Linux and Windows: for every push to main or develop and every pull request
# into main, develop or a release/<version> branch. macOS runs only when asked, since its runners
# are slow and scarce:
# - pushing a tag macos-test (or macos-test-<anything>) runs them on Linux, Windows and macOS, on the
#   tagged commit, and the push of the branch with that commit runs nothing (see plan below);
# - running the workflow by hand (Actions > CI > Run workflow) with "macos" checked adds macOS;
# - the release workflow calls it with macos: true, so no installer is built from code whose tests
#   fail on any platform.
name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "macos-test*"
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  workflow_dispatch:
    inputs:
      macos:
        description: Also on macOS
        type: boolean
        default: false
  workflow_call:
    inputs:
      macos:
        description: Also on macOS
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Where the tests run. A push of main or develop whose commit also has a macos-test tag runs
  # nothing: the tag's run tests that commit on every platform, so there is one run, not two. Push
  # both at once so the tag is there when this looks:
  #   git tag -f macos-test && git push --atomic -f origin develop macos-test
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - id: os
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS: ${{ startsWith(github.ref, 'refs/tags/macos-test') || inputs.macos }}
          BRANCH_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && !inputs.macos }}
        run: |
          if [ "$BRANCH_PUSH" = true ]; then
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/macos-test" \
              --jq ".[] | select(.object.sha == \"$GITHUB_SHA\") | .ref" | head -n 1)
            if [ -n "$tagged" ]; then
              echo "$tagged is on this commit: its run tests it"
              echo 'os=[]' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$MACOS" = true ]; then
            echo 'os=["ubuntu-22.04", "windows-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-22.04", "windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.os != '[]'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libwayland-dev libxkbcommon-dev
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      # Python runs the plugin host tests (crates/frameworks/tests/python_plugin_host.rs).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
