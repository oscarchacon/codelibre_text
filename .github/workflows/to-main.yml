# Takes a release/<version> branch to main: commits its version in Cargo.toml to the branch, then
# merges it into main and pushes main, without a pull request (if it cannot be merged, a conflict,
# the job fails and it is solved by hand).
# release/<version> goes straight into main: develop never does. main takes no pull requests and no
# pushes from people: its ruleset lets only this workflow's identity in (docs/release-flow.md), the
# GitHub App of RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY when they are set, else RELEASE_PUSH_TOKEN.
# - The release workflow calls it once every installer is uploaded, for the versions
#   .github/scripts/goes-to-main.sh takes to main (final versions; any other only with a tag).
# - Any version goes to main when asked: push a tag to-main/<version> or main/<version>, on develop,
#   staging or release/<version>, at any time (git tag to-main/0.1.0-alpha develop && git push origin
#   to-main/0.1.0-alpha). Main never gets a version whose builds failed: pushed before the build,
#   the tag only tells the release workflow, which calls this when every installer is uploaded;
#   pushed after it, this merges at once. The tag also refreshes the description of the open pull
#   request into release/<version> (release-pr.yml), which then says it goes to main.
# TODO: merge main back into develop after a release, so the "chore: release <version>" commits of
# Cargo.toml do not conflict in the next pull request from develop.
name: To main

on:
  push:
    tags:
      - "to-main/*"
      - "main/*"
  workflow_call:
    inputs:
      version:
        description: The version of the release/<version> branch
        type: string
        required: true

permissions:
  contents: read

jobs:
  # A tag pushed: the open pull request into release/<version> now says it goes to main.
  describe:
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/release-pr.yml
    with:
      # to-main/<version> or main/<version>: release-pr.yml keeps what follows the last /.
      version: ${{ github.ref_name }}
    secrets: inherit

  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      HAS_APP: ${{ vars.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # The identity main's ruleset lets in: a GitHub App installed on this repository only, so
      # that nobody else (its owner included) can write to main.
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # Without the App, RELEASE_PUSH_TOKEN: a token that can write contents and workflows (by
      # default github.token cannot change workflow files in main, and its pushes start no workflow).
      - name: Choose the token
        env:
          TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_PUSH_TOKEN || github.token }}
        run: echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # X.Y.Z, X.Y.Z-alpha.1, X.Y.Z.W-alpha...: the rules are in .github/scripts/version.sh.
      - id: version
        name: Read the version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${INPUT:-${TAG#*/}}"
          bash .github/scripts/version.sh check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cargo_version=$(bash .github/scripts/version.sh cargo "$version")" >> "$GITHUB_OUTPUT"
          files=0
          if gh api "repos/$GH_REPO/branches/release/$version" --silent 2> /dev/null; then
            files=$(gh release view "v$version" --json assets --jq '.assets | length' 2> /dev/null || echo 0)
          fi
          if [ "$files" != 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag pushed before the build: the release workflow sees it and merges when it ends.
            echo "::notice::release v$version is not built yet: release.yml takes it to main once release/$version builds"
          else
            echo "::error::release v$version has no installers"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.version.outputs.ready == 'true'
        with:
          ref: release/${{ steps.version.outputs.version }}
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}
      # [skip ci]: this push must not start the release workflow again.
      - name: Commit the version
        if: steps.version.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CARGO_VERSION: ${{ steps.version.outputs.cargo_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          perl -pi -e "s/^version = \".*\"/version = \"$CARGO_VERSION\"/" Cargo.toml
          if ! git diff --quiet; then
            git commit --all --message "chore: release $VERSION [skip ci]"
            git push origin "HEAD:release/$VERSION"
          fi
      # Straight into main, no pull request: main's ruleset takes nothing else.
      - name: Merge into main
        if: steps.version.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then
            echo "main already has this branch"
            exit 0
          fi
          release=$(git rev-parse HEAD)
          git checkout -B main origin/main
          git merge --no-ff "$release" -m "Merge release/$VERSION into main" \
            -m "Installers built and uploaded to the release v$VERSION."
          git push origin main
