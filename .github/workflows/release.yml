# Pushing a branch release/<version> (release/0.1.0-alpha) builds the installers of every platform
# (Linux x64 and arm64: .deb, .rpm and a portable .tar.xz; Windows x64 and arm64: a setup .exe and a
# portable .zip; macOS: a .dmg for Apple Silicon only)
# and uploads them to a draft GitHub Release, with a SHA256SUMS signed by the release GPG key (which
# also signs the .deb and .rpm) and build provenance attestations. The tests (ci.yml, macOS
# included) run first: nothing is built if they fail. Publishing the draft stays a manual step, and
# pushing to the branch again replaces its files. If all of that works, the version is merged into
# main (to-main.yml) when .github/scripts/goes-to-main.sh says so: final versions always, any other
# version (-rc, -alpha, -beta) only with a tag to-main/<version> or main/<version>, pushed before
# this build or after it.
# Creating the branch (open-release.yml, or by hand on the web) builds nothing: the merge of its
# pull request from develop, or a later push, does.
name: Release

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  tests:
    # A push that creates the branch: nothing to release yet. Every other job needs this one.
    if: github.event.created == false
    uses: ./.github/workflows/ci.yml
    with:
      macos: true

  version:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.branch.outputs.version }}
      # The same in Cargo.toml, which takes three numbers only (.github/scripts/version.sh).
      cargo_version: ${{ steps.branch.outputs.cargo_version }}
      to_main: ${{ steps.main.outputs.to_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # X.Y.Z, X.Y.Z-alpha.1, X.Y.Z.W-alpha...: the rules are in .github/scripts/version.sh.
      - id: branch
        name: Read the version from the branch name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version="${BRANCH#release/}"
          bash .github/scripts/version.sh check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cargo_version=$(bash .github/scripts/version.sh cargo "$version")" >> "$GITHUB_OUTPUT"
      # The rules are in .github/scripts/goes-to-main.sh (also used for the pull request's
      # description). A tag pushed after the build: to-main.yml merges it then.
      - id: main
        name: Decide if this version goes to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.branch.outputs.version }}
        run: |
          decision=$(bash .github/scripts/goes-to-main.sh "$VERSION")
          echo "$decision"
          echo "$decision" >> "$GITHUB_OUTPUT"

  # Built natively on x64 and arm64 runners. The oldest supported Ubuntu: the binary needs the glibc
  # it was built against, or newer.
  linux:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            package_arch: amd64
            nfpm_arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
            package_arch: arm64
            nfpm_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_VERSION: ${{ needs.version.outputs.cargo_version }}
      ARCH: ${{ matrix.package_arch }}
      NFPM_VERSION: 2.48.0
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        run: perl -pi -e "s/^version = \".*\"/version = \"$CARGO_VERSION\"/" Cargo.toml
      - name: Install the system libraries
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libwayland-dev libxkbcommon-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # The compiled dependencies, reused by the next push to this branch (or a rerun).
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Build
        run: cargo build --release
      # Python for the plugins, inside the packages (in /usr/lib/codelibre-text/python).
      - name: Download Python
        run: sh packaging/python/fetch_python.sh target/release/python
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Signed with the release GPG key (see packaging/linux/nfpm.yaml). With the SemVer version:
      # .deb and .rpm order versions by it (0.1.3-alpha+1 is 0.1.3~alpha+1, newer than 0.1.3~alpha).
      - name: Create the .deb and .rpm
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ needs.version.outputs.cargo_version }}
        run: |
          mkdir -p dist
          export GPG_KEY_FILE="$RUNNER_TEMP/release-key.asc"
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$GPG_KEY_FILE"
          nfpm package --config packaging/linux/nfpm.yaml --packager deb --target dist/
          nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target dist/
      # Portable: unpack anywhere and run codelibre_text (the .desktop and icon are for the menu).
      - name: Create the .tar.xz
        run: |
          name="codelibre-text-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/$name"
          cp target/release/codelibre_text LICENSE assets/icons/codelibre_text.png packaging/linux/codelibre_text.desktop "$RUNNER_TEMP/$name/"
          cp -R target/release/python "$RUNNER_TEMP/$name/python"
          tar -C "$RUNNER_TEMP" -cJf "dist/$name.tar.xz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # x64 and arm64, both on the x64 runner (its Visual Studio has the ARM64 build tools).
  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_VERSION: ${{ needs.version.outputs.cargo_version }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        run: perl -pi -e "s/^version = \".*\"/version = \"$CARGO_VERSION\"/" Cargo.toml
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$CARGO_BUILD_TARGET"
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Build
        run: cargo build --release
      # Python for the plugins (native x64 or ARM64), next to the .exe: inside the installer, so
      # it installs offline.
      - name: Download Python
        run: sh packaging/python/fetch_python.sh "target/$CARGO_BUILD_TARGET/release/python" "$CARGO_BUILD_TARGET"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create the installer
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$VERSION" "//DAppArch=$ARCH" \
            "//DBinDir=..\\..\\target\\$CARGO_BUILD_TARGET\\release" packaging/windows/codelibre_text.iss
      # Portable: unzip anywhere and run codelibre_text.exe, without installing.
      - name: Create the .zip
        run: |
          name="codelibre-text-$VERSION-windows-$ARCH"
          mkdir -p "$RUNNER_TEMP/$name"
          cp "target/$CARGO_BUILD_TARGET/release/codelibre_text.exe" "$RUNNER_TEMP/$name/"
          cp -R "target/$CARGO_BUILD_TARGET/release/python" "$RUNNER_TEMP/$name/python"
          cp LICENSE "$RUNNER_TEMP/$name/LICENSE.txt"
          (cd "$RUNNER_TEMP" && 7z a -tzip "$name.zip" "$name")
          mv "$RUNNER_TEMP/$name.zip" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Apple Silicon only (macos-latest is arm64): Intel Macs are not built.
  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_VERSION: ${{ needs.version.outputs.cargo_version }}
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      APP: target/aarch64-apple-darwin/release/CodeLibre Text.app
      DMG: dist/codelibre-text-${{ needs.version.outputs.version }}-macos-arm64.dmg
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        run: perl -pi -e "s/^version = \".*\"/version = \"$CARGO_VERSION\"/" Cargo.toml
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$CARGO_BUILD_TARGET"
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-arm64
      - name: Build the app
        run: sh packaging/macos/make_app.sh
      # Ad hoc: without a certificate this only keeps the bundle's signature valid, so that macOS
      # reports an unidentified developer and not a damaged app.
      - name: Sign the app ad hoc
        run: codesign --force --deep --sign - "$APP"
      - name: Create the .dmg
        run: |
          mkdir -p dist dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "CodeLibre Text" -srcfolder dmg -format UDZO "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations (gh attestation verify <file> --repo <owner/repo>).
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # nfpm writes 0.1.0~alpha in .deb / .rpm names and GitHub would upload them as 0.1.0.alpha:
      # renamed first, SHA256SUMS and the attestations name the files people download.
      - name: Name the files as GitHub will
        run: |
          for file in dist/*~*; do
            [ -e "$file" ] && mv "$file" "${file//\~/.}"
          done
          ls dist
      - name: Attest where the installers come from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      # SHA256SUMS lists every file; SHA256SUMS.asc is its signature with the release GPG key.
      - name: Write and sign the checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign SHA256SUMS
      - name: Create the draft release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            prerelease=""
            [[ "$TAG" == *-* ]] && prerelease="--prerelease"
            notes="Windows and macOS installers are not signed yet: SmartScreen and Gatekeeper warn when they are opened.

          Verify a download: \`SHA256SUMS\` is signed (\`SHA256SUMS.asc\`) with the release key [codelibre-text-release.asc](https://github.com/$GH_REPO/blob/main/packaging/codelibre-text-release.asc), which also signs the .deb and .rpm; \`gh attestation verify <file> --repo $GH_REPO\` checks it was built by this workflow."
            gh release create "$TAG" --draft $prerelease --target "$GITHUB_SHA" --title "CodeLibre Text $TAG" --notes "$notes"
          fi
      - name: Upload the installers
        run: gh release upload "$TAG" dist/* --clobber

  # Once every installer is uploaded, the version goes to main (to-main.yml) when goes-to-main.sh
  # said so; otherwise it stays out until a tag to-main/<version> or main/<version> asks for it.
  main:
    needs: [version, release]
    if: needs.version.outputs.to_main == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/to-main.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
